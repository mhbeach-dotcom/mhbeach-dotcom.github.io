<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mattbeach.me</title>
<style>
  :root { --bg:#0d0a07; --gold:#e8b33d; --gold-dim:#9a7426; --ember:#ff5a2a; --cream:#f5ead6; --muted:#a89880; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; overflow: hidden;
    background: radial-gradient(1200px 800px at 50% -10%, #2a1a0c 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--gold);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace;
  }
  .embers { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .embers i {
    position: absolute; bottom: -12px; width: 6px; height: 6px; border-radius: 50%;
    background: radial-gradient(circle, #ffd27a 0%, var(--ember) 60%, transparent 70%);
    opacity: 0; animation: rise 12s linear infinite;
  }
  @keyframes rise {
    0% { transform: translate(0, 0) scale(var(--s, 1)); opacity: 0; }
    10% { opacity: .85; }
    100% { transform: translate(var(--dx, 0), -105vh) scale(0); opacity: 0; }
  }
  main { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 14px; max-width: 100%; }
  h1 {
    font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    font-size: clamp(38px, 9vw, 72px); margin: 0 0 1.2rem; letter-spacing: 2px;
    background: linear-gradient(100deg, #ffe9b0 0%, var(--gold) 30%, var(--ember) 55%, #ffe9b0 80%, var(--gold) 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 5s linear infinite, titleIn .8s cubic-bezier(.2, .8, .3, 1) both;
  }
  @keyframes shimmer { to { background-position: -250% 0; } }
  @keyframes titleIn { from { opacity: 0; letter-spacing: 12px; transform: scale(.94); } to { opacity: 1; letter-spacing: 2px; transform: none; } }
  pre#scene {
    margin: 0; line-height: 1.05; font-size: clamp(5px, 1.4vw, 15px);
    white-space: pre; user-select: none; color: var(--gold);
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(232, 179, 61, .35)); }
    50% { filter: drop-shadow(0 0 18px rgba(255, 120, 40, .7)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .embers { display: none; }
  }
</style>
</head>
<body>
<div class="embers" id="embers"></div>
<main>
<h1>Mattbeach.me</h1>
<pre id="scene" aria-label="ASCII animation of a submarine"></pre>
</main>

<script>
(function () {
  var W = 100, H = 24, SURFACE = 2;

  // Long smooth hull, tall sail with sail-mounted planes,
  // cruciform stern planes, and a shrouded pump-jet propulsor.
  var SUB = [
    "                 __                                    ",
    "                |==|                                   ",
    "               _|  |__                                 ",
    "          ____/ |__|  \\______________________          ",
    "     ____/ ==                                 \\___     ",
    "  __/                                              \\_  ",
    " (                                                    ) ",
    "  \\__                                              _/  ",
    "     \\____ _________________________________  ___/     ",
    "          \\\\__________________________________//        "
  ];
  var PROP = ["-<[", "-<(", "-<{", "-<("]; // spinning pump-jet frames
  var subW = SUB[0].length, subH = SUB.length;

  var bubbles = [];
  var t = 120;
  var el = document.getElementById("scene");

  function blank() {
    var g = [];
    for (var y = 0; y < H; y++) g.push(new Array(W).fill(" "));
    return g;
  }
  function put(g, x, y, s) {
    if (y < 0 || y >= H) return;
    for (var i = 0; i < s.length; i++) {
      var xx = x + i;
      if (xx >= 0 && xx < W && s[i] !== " ") g[y][xx] = s[i];
    }
  }

  function frame() {
    var g = blank();

    // water surface
    var waves = "~-~_";
    for (var x = 0; x < W; x++) {
      g[SURFACE][x] = waves[(x + Math.floor(t / 2)) % waves.length];
      g[SURFACE + 1][x] = (x + Math.floor(t / 3)) % 7 === 0 ? "~" : " ";
    }

    // sea floor
    for (var x2 = 0; x2 < W; x2++) {
      g[H - 1][x2] = ((x2 * 7 + 3) % 5 === 0) ? "^" : "_";
    }

    // submarine glides left-to-right (bow on the right), with gentle bobbing
    var span = W + subW + 10;
    var sx = Math.floor((t * 0.6) % span) - subW - 5;
    var sy = 7 + Math.round(Math.sin(t / 18) * 1.5);
    for (var r = 0; r < subH; r++) put(g, sx, sy + r, SUB[r]);
    // propulsor behind the stern
    put(g, sx - 3, sy + 6, PROP[Math.floor(t / 2) % PROP.length]);

    // bubbles from the stern
    if (t % 3 === 0) bubbles.push({ x: sx - 4, y: sy + 6, c: "o" });
    if (t % 5 === 0) bubbles.push({ x: sx - 5 + (t % 3), y: sy + 5, c: "." });
    for (var i = bubbles.length - 1; i >= 0; i--) {
      var b = bubbles[i];
      if (t % 2 === 0) { b.y -= 1; b.x += (Math.random() < 0.5 ? -1 : 0); }
      if (b.y <= SURFACE + 1) { bubbles.splice(i, 1); continue; }
      if (b.x >= 0 && b.x < W && g[b.y][b.x] === " ") g[b.y][b.x] = b.c;
    }

    // wake lines behind the boat
    for (var k = 1; k <= 4; k++) {
      put(g, sx - 6 - k * 3, sy + 6, "-");
    }

    el.textContent = g.map(function (row) { return row.join(""); }).join("\n");
    t++;
  }

  var box = document.getElementById("embers");
  for (var n = 0; n < 16; n++) {
    var e = document.createElement("i");
    e.style.left = (Math.random() * 100) + "%";
    e.style.setProperty("--s", String(0.4 + Math.random() * 0.9));
    e.style.setProperty("--dx", (-40 + Math.random() * 80) + "px");
    e.style.animationDuration = (9 + Math.random() * 10) + "s";
    e.style.animationDelay = (-Math.random() * 14) + "s";
    box.appendChild(e);
  }

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  frame();
  if (!reduce) setInterval(frame, 80);
})();
</script>
</body>
</html>
